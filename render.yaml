# Render Blueprint: one free web service running the InvestIQ FastAPI app.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the
# secret values (sync: false) in the service's Environment tab. Keys never go in git.
services:
  - type: web
    name: investiq-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn investiq.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: INVESTIQ_ALLOWED_ORIGINS
        value: https://atulswain.github.io
      - key: INVESTIQ_RATE_LIMIT
        value: "60"
      - key: INVESTIQ_CACHE_DIR
        value: /tmp/investiq-cache
      # Data providers - each is optional; leave blank to disable.
      - key: FMP_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      # AI research (phase 5) - stored now so it is ready.
      - key: ANTHROPIC_API_KEY
        sync: false
