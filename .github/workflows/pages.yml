name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Weekdays 16:52 IST (11:22 UTC), after the NSE close.
    - cron: "22 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Build reports
        run: python -m investiq.build_static --out site
        env:
          # Optional: the hosted InvestIQ API (Settings -> Secrets and variables -> Actions -> Variables).
          # When set, the site loads live reports from it and falls back to this snapshot.
          INVESTIQ_API_URL: ${{ vars.INVESTIQ_API_URL }}
          # Optional keys: let the snapshot fall back to FMP / Twelve Data if Yahoo blocks GitHub's runners.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
